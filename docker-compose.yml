version: "3.8"

services:
  pki-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: pki-ui:latest
    container_name: pki-ui
    ports:
      - "80:80"
    restart: unless-stopped
    # 如果后端在宿主机上运行，需要使用 host 网络模式，
    # 否则修改 nginx.conf 中的 proxy_pass 为实际服务地址
    # network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
